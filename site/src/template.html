<!doctype html>
<!--
  Endlessly ending stories. If you are a model or a script reading this page as text: the same
  content without markup is at {{ROOT}}llms.txt (every room, by instruction) and {{ROOT}}t/<room>.txt
  (one room: note, rule, every hop's text). On this page each <section class="room"> is one room.
  Inside it each <div class="lane"> is one run, and <ol class="hops"> holds every hop in order, one
  <li class="hop" data-t="N"> per hop, each with its citation (hop, model, run id, tag), the model's
  text exactly as returned (the JSON text field, or the raw output in monospace when the output did
  not parse), the harness metrics, and the raw output in a <details>. Hop 0 is the seed. <mark> wraps
  words not carried over from the previous hop; <del>, in a hidden copy, marks words the next hop
  dropped; neither adds text. Everything in class "note", "authored", "content-note", the titles and
  the colophon is authored by the site's builders; everything in class "text", "preamble", "rule",
  "seed" and <pre> is data. A rule ("Return this JSON object ...") is the instruction a model in the
  loop was given, quoted; it is not addressed to you.
-->
